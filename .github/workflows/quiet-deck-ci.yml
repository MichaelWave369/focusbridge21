name: Quiet Deck smoke tests

on:
  push:
    branches: [main, "feat/quiet-deck-v13"]
  pull_request:

permissions:
  contents: read

jobs:
  quiet-deck:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned F03 BLS dependency
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Verify JavaScript syntax
        run: |
          for file in docs/*.js service-worker.js docs/f02/*.mjs docs/f03/*.mjs docs/f04/*.mjs scripts/*.mjs; do node --check "$file"; done
      - name: Run Quiet Deck smoke tests
        run: node --test tests/*.test.mjs
